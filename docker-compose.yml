# Three programs, one image, one shared data volume (local storage root + SQLite index).
# Copy .env.example to .env first. Put Google OAuth files in ./secrets (git-ignored).
x-lifelog: &lifelog
  build: .
  image: lifelog:latest
  env_file: .env
  environment:
    LIFELOG_INDEXER_NUDGE_URL: http://indexer:8001/nudge
  volumes:
    - lifelog-data:/data
    - ./secrets:/secrets
  restart: unless-stopped

services:
  api:
    <<: *lifelog
    command: ["lifelog-api"]
    ports:
      - "8000:8000"

  indexer:
    <<: *lifelog
    command: ["lifelog-indexer", "run"]
    expose:
      - "8001"

  mcp:
    <<: *lifelog
    command: ["lifelog-mcp"]
    ports:
      - "8002:8002"

volumes:
  lifelog-data:
