# Lumitrace: three programs, one image, one shared data volume (local storage root + SQLite
# index). Copy .env.example to .env first. Put Google OAuth files in ./secrets (git-ignored).
x-lumitrace: &lumitrace
  build: .
  image: lumitrace:latest
  env_file: .env
  environment:
    LUMITRACE_INDEXER_NUDGE_URL: http://spectrum:8001/nudge
    LUMITRACE_MCP_ADMIN_HOST: 0.0.0.0
    LUMITRACE_MCP_ADMIN_URL: http://lens:8003
  volumes:
    - lumitrace-data:/data
    - ./secrets:/secrets
  restart: unless-stopped

services:
  prism:
    <<: *lumitrace
    command: ["lumitrace-prism"]
    ports:
      - "8000:8000"

  spectrum:
    <<: *lumitrace
    command: ["lumitrace-spectrum", "run"]
    # Internal only: POST /nudge has no auth. Never add `ports:` here; the prism service
    # reaches it as http://spectrum:8001 on the Compose network.
    expose:
      - "8001"

  lens:
    <<: *lumitrace
    command: ["lumitrace-lens"]
    ports:
      - "8002:8002"
    # 8003 is the private admin API (connected AI apps) the prism service calls. Never publish
    # it: keep it out of `ports:` here and out of Tailscale serve/funnel.
    expose:
      - "8003"

volumes:
  lumitrace-data:
