<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="194" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset=".45" stop-color="#4cc9f0"/>
      <stop offset=".7" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="393" y1="0" x2="461" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset=".4" stop-color="#4cc9f0"/>
      <stop offset=".7" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark card so the light labels stay readable on a white page (GitHub README) -->
  <rect width="600" height="150" fill="#141726"/>

  <!-- connectors: white light into the Prism, colors out of it -->
  <line x1="80" y1="60" x2="160" y2="60" stroke="#e8eaf6" stroke-width="3" stroke-linecap="round"/>
  <g stroke-width="2.5" stroke-linecap="round">
    <line x1="194" y1="60" x2="278" y2="48" stroke="#8b7cff"/>
    <line x1="194" y1="60" x2="278" y2="57" stroke="#4cc9f0"/>
    <line x1="194" y1="60" x2="278" y2="66" stroke="#3ddc97"/>
    <line x1="194" y1="60" x2="278" y2="75" stroke="#ffb547"/>
  </g>
  <line x1="330" y1="60" x2="386" y2="60" stroke="url(#spec)" stroke-width="3" stroke-linecap="round"/>
  <line x1="468" y1="60" x2="520" y2="60" stroke="url(#spec)" stroke-width="3" stroke-linecap="round"/>

  <!-- the travelling light -->
  <circle r="5" fill="#ffffff" filter="url(#glow)">
    <animateMotion path="M52,60 H544" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" dur="4s" repeatCount="indefinite"
      values="#ffffff;#ffffff;#8b7cff;#4cc9f0;#3ddc97;#ffb547" keyTimes="0;.25;.4;.6;.8;1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;1;1;0" keyTimes="0;.06;.92;1"/>
  </circle>

  <!-- Flash -->
  <circle cx="52" cy="60" r="26" fill="none" stroke="#ffb547" stroke-width="2">
    <animate attributeName="r" values="26;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" keyTimes="0;.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="60" r="26" fill="#1b1f33" stroke="#ffb547" stroke-width="2"/>
  <polygon transform="translate(52,60)" points="3,-17 -10,4 -1,4 -5,19 10,-5 1,-5" fill="#ffd28a"/>

  <!-- Prism -->
  <polygon transform="translate(177,60)" points="0,-30 28,20 -28,20" fill="url(#glass)"
    stroke="#e8eaf6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Frames: one page per day -->
  <rect x="288" y="26" width="36" height="44" rx="5" fill="#141726" stroke="#3a4066" stroke-width="1.5"/>
  <rect x="283" y="32" width="36" height="44" rx="5" fill="#141726" stroke="#3a4066" stroke-width="1.5"/>
  <rect x="278" y="38" width="36" height="44" rx="5" fill="#1b1f33" stroke="#8a90b2" stroke-width="1.5"/>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="285" y1="48" x2="305" y2="48" stroke="#8b7cff"/>
    <line x1="285" y1="57" x2="300" y2="57" stroke="#4cc9f0"/>
    <line x1="285" y1="66" x2="307" y2="66" stroke="#3ddc97"/>
    <line x1="285" y1="75" x2="297" y2="75" stroke="#ffb547"/>
  </g>

  <!-- Spectrum: every day, in order -->
  <line x1="389" y1="85" x2="465" y2="85" stroke="#3a4066" stroke-width="1.5"/>
  <g fill="url(#bars)">
    <rect x="393" y="62" width="8" height="20" rx="2"/>
    <rect x="405" y="48" width="8" height="34" rx="2"/>
    <rect x="417" y="56" width="8" height="26" rx="2"/>
    <rect x="429" y="38" width="8" height="44" rx="2"/>
    <rect x="441" y="52" width="8" height="30" rx="2"/>
    <rect x="453" y="44" width="8" height="38" rx="2"/>
  </g>

  <!-- Lens -->
  <circle cx="544" cy="56" r="19" fill="#ffb547" opacity="0">
    <animate attributeName="opacity" values="0;0;.45;0" keyTimes="0;.86;.94;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="544" cy="56" r="19" fill="url(#glass)" stroke="#e8eaf6" stroke-width="3"/>
  <line x1="558" y1="70" x2="570" y2="82" stroke="#e8eaf6" stroke-width="5" stroke-linecap="round"/>

  <!-- labels -->
  <g text-anchor="middle" font-size="22" font-weight="650" fill="#e8eaf6">
    <text x="52" y="116">Flash</text>
    <text x="177" y="116">Prism</text>
    <text x="300" y="116">Frames</text>
    <text x="427" y="116">Spectrum</text>
    <text x="548" y="116">Lens</text>
  </g>
  <g text-anchor="middle" font-size="16" fill="#8a90b2">
    <text x="52" y="140">capture</text>
    <text x="177" y="140">split</text>
    <text x="300" y="140">day files</text>
    <text x="427" y="140">index</text>
    <text x="548" y="140">ask AI</text>
  </g>
</svg>
